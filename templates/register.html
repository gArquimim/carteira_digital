{% extends "base.html" %}

{% block title %}Casteira-digital/Cadastro{% endblock %}

{% block content %}
    
<div class="container-auth">
    <div class="auth">

        <div class="auth-title">
            <h1>Cadastro</h1>
        </div>

        <form id="auth-form" class="auth-form">

            <div class="auth-group">
                <label for="name-input">Seu nome</label>
                <input id="name-input" type="text" name="name" required placeholder="Ronald Mcdonald">
                <small id="name-error" class="small-message"></small>
            </div>
            
            <div class="auth-group">
                <label for="email-input">Seu e-mail</label>
                <input id="email-input" type="email" name="email" required placeholder="Carteira.digital@gmail.com">
                <small id="email-error" class="small-message"></small>
            </div>

            <div class="auth-group">
                <label for="password-input">Sua senha</label>
                <input id="password-input" type="password" name="password" required>

                <label for="password-confirm-input">Confirme sua senha</label>
                <input id="password-confirm-input" type="password" name="password-confirm" required>
                
                <small id="password-error" class="small-message"></small>
            </div>
            
            <button class="auth-button" type="submit">Enviar</button>

        </form>
        
    </div>
</div>

<div class="toast" id="toast">
    <p></p>
</div>

    <script src="{{ url_for('static', filename='register.js') }}"></script>

{% endblock %}
